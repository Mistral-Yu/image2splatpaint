name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Verify JavaScript
        run: |
          for file in web/app.js scripts/*.mjs; do node --check "$file"; done
          node scripts/public_surface_tests.mjs
          node scripts/standard_alpha_tests.mjs
          node scripts/train_bind_group_cache_tests.mjs
          node scripts/stage_min_scale_tests.mjs
          node scripts/tilt_robustness_tests.mjs
          node scripts/tilt_camera_tests.mjs
          node scripts/virtual_tilt_tests.mjs
          node scripts/virtual_bounded_depth_tests.mjs
          node scripts/large_dispatch_tests.mjs
          node scripts/p2_budget_contract_tests.mjs
          node scripts/p2_optimizer_input_tests.mjs
          node scripts/p2_export_memory_tests.mjs
          node scripts/independent_ply_parser_tests.mjs
          node scripts/adaptive_capacity_tests.mjs
          node scripts/gpu_memory_status_tests.mjs
          node scripts/export_cross_platform_tests.mjs
      - name: Build static artifact
        run: node scripts/build-pages.mjs
      - name: Verify Pages artifact
        run: node scripts/pages_artifact_tests.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
